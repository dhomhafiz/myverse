<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Contact hover and ripple evidence</title><style>body{margin:24px;background:#0c1012;color:#edf5f3;font:15px monospace}main{max-width:1000px;margin:auto}img{display:block;width:100%;margin:20px 0}input{width:100%}button{margin:12px 12px 0 0;padding:10px;background:#172a30;color:inherit;border:1px solid #a4e2eb;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #a4e2eb;outline-offset:4px}</style><main><h1>Contact interaction frames</h1><p>Production Chrome capture: hover, press and liquid grid response. Text and controls remain outside the displaced backdrop. Frames are variably spaced; this viewer does not assume a fixed frame rate.</p><img id="frame" alt="Recorded Contact interaction"><label for="slider">Frame <output id="number"></output></label><input id="slider" type="range" min="0" value="0"><button id="prev">Previous</button><button id="next">Next</button></main><script>const frames=["interaction-frame-000.jpg", "interaction-frame-001.jpg", "interaction-frame-002.jpg", "interaction-frame-003.jpg", "interaction-frame-004.jpg", "interaction-frame-005.jpg", "interaction-frame-006.jpg", "interaction-frame-007.jpg", "interaction-frame-008.jpg", "interaction-frame-009.jpg", "interaction-frame-010.jpg", "interaction-frame-011.jpg", "interaction-frame-012.jpg", "interaction-frame-013.jpg", "interaction-frame-014.jpg", "interaction-frame-015.jpg", "interaction-frame-016.jpg", "interaction-frame-017.jpg", "interaction-frame-018.jpg", "interaction-frame-019.jpg", "interaction-frame-020.jpg", "interaction-frame-021.jpg", "interaction-frame-022.jpg", "interaction-frame-023.jpg", "interaction-frame-024.jpg", "interaction-frame-025.jpg", "interaction-frame-026.jpg", "interaction-frame-027.jpg", "interaction-frame-028.jpg"];const slider=document.getElementById('slider');slider.max=frames.length-1;function show(){const i=Number(slider.value);document.getElementById('frame').src=frames[i];document.getElementById('number').textContent=(i+1)+' / '+frames.length}slider.oninput=show;document.getElementById('prev').onclick=()=>{slider.value=Math.max(0,Number(slider.value)-1);show()};document.getElementById('next').onclick=()=>{slider.value=Math.min(frames.length-1,Number(slider.value)+1);show()};show();</script></html>
